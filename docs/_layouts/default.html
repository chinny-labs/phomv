<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != "/" %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} · photo move{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <link rel="icon" type="image/svg+xml" href="{{ '/phomv-favicon.svg' | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/favicon-32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/favicon-16.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/favicon-64.png' | relative_url }}">

  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:image" content="{{ '/phomv-lockup.png' | absolute_url }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --cream: #FBF6EA;
      --noodle: #FBF3E0;
      --deep: #11302D;
      --bowl-dk: #13564E;
      --bowl: #1C7A70;
      --bowl-hi: #34A093;
      --sage: #7C8A6E;
      --pale-teal: #CFE7E0;
      --broth: #F4A93C;
      --broth-dk: #E0892A;
      --leaf: #5BBE7B;
      --soft-teal: #7FA9A1;
      --sans: 'Space Grotesk', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--bowl-dk);
      font-family: var(--sans);
      font-weight: 400;
      font-size: 17px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .container {
      max-width: 740px;
      margin: 0 auto;
      padding: 56px 24px 96px;
    }

    header.site {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 40px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--pale-teal);
    }

    header.site a.brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--bowl-dk);
      font-weight: 600;
      font-size: 20px;
      letter-spacing: -0.01em;
    }

    header.site img.mark {
      width: 32px;
      height: 32px;
      display: block;
    }

    header.site nav {
      margin-left: auto;
      display: flex;
      gap: 22px;
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 500;
    }

    header.site nav a {
      color: var(--sage);
      text-decoration: none;
    }

    header.site nav a:hover { color: var(--bowl-hi); }

    h1, h2, h3, h4 {
      font-family: var(--sans);
      color: var(--deep);
      letter-spacing: -0.015em;
      line-height: 1.2;
    }

    h1 { font-size: 38px; font-weight: 700; margin: 0 0 16px; }
    h2 { font-size: 26px; font-weight: 600; margin: 48px 0 16px; }
    h3 { font-size: 19px; font-weight: 600; margin: 32px 0 12px; }

    p { margin: 16px 0; }

    a { color: var(--bowl-hi); text-decoration: none; border-bottom: 1px solid transparent; transition: border-color .12s ease, color .12s ease; }
    a:hover { color: var(--broth-dk); border-bottom-color: var(--broth); }

    strong { color: var(--deep); font-weight: 600; }

    hr { border: 0; border-top: 1px solid var(--pale-teal); margin: 40px 0; }

    ul, ol { padding-left: 22px; }
    li { margin: 6px 0; }
    li::marker { color: var(--bowl-hi); }

    code {
      font-family: var(--mono);
      font-size: 0.92em;
      background: var(--noodle);
      color: var(--bowl-dk);
      padding: 1px 6px;
      border-radius: 4px;
      border: 1px solid var(--pale-teal);
    }

    pre {
      font-family: var(--mono);
      background: var(--deep);
      color: var(--noodle);
      padding: 18px 20px;
      border-radius: 10px;
      overflow-x: auto;
      font-size: 14px;
      line-height: 1.55;
      border: 1px solid var(--bowl-dk);
    }
    pre code {
      background: transparent;
      color: inherit;
      padding: 0;
      border: 0;
      border-radius: 0;
      font-size: inherit;
    }
    .highlight pre { padding: 18px 20px; }
    .highlight .c, .highlight .c1, .highlight .cm { color: var(--soft-teal); font-style: italic; } /* comments */
    .highlight .s, .highlight .s1, .highlight .s2 { color: var(--leaf); } /* strings */
    .highlight .k, .highlight .kd, .highlight .kr { color: var(--broth); } /* keywords */
    .highlight .nb, .highlight .nf { color: var(--leaf); } /* builtins / functions */
    .highlight .nv { color: var(--pale-teal); } /* variables */
    .highlight .o { color: var(--broth); } /* operators */
    .highlight .gp { color: var(--leaf); } /* prompts */

    blockquote {
      margin: 20px 0;
      padding: 12px 18px;
      border-left: 3px solid var(--broth);
      background: var(--noodle);
      color: var(--bowl-dk);
      border-radius: 0 8px 8px 0;
    }
    blockquote p:first-child { margin-top: 0; }
    blockquote p:last-child  { margin-bottom: 0; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
      font-size: 15px;
    }
    th, td {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid var(--pale-teal);
    }
    th {
      color: var(--deep);
      font-weight: 600;
      background: var(--noodle);
    }
    td code { font-size: 13px; }

    img { max-width: 100%; height: auto; }

    .lockup { display: block; margin: 8px auto 24px; max-width: 420px; }

    .tagline {
      font-family: var(--mono);
      color: var(--sage);
      font-size: 14px;
      letter-spacing: 0.01em;
      text-align: center;
      margin-top: -8px;
    }

    footer.site {
      margin-top: 64px;
      padding-top: 24px;
      border-top: 1px solid var(--pale-teal);
      font-family: var(--mono);
      font-size: 13px;
      color: var(--sage);
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
    }
    footer.site a { color: var(--sage); }
    footer.site a:hover { color: var(--bowl-hi); }

    @media (max-width: 560px) {
      .container { padding: 32px 18px 64px; }
      h1 { font-size: 30px; }
      h2 { font-size: 22px; }
      header.site { flex-wrap: wrap; gap: 16px; }
      header.site nav { margin-left: 0; width: 100%; gap: 16px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="site">
      <a class="brand" href="{{ '/' | relative_url }}">
        <img class="mark" src="{{ '/phomv-icon.png' | relative_url }}" alt="">
        phomv
      </a>
      <nav>
        <a href="{{ '/install.html' | relative_url }}">install</a>
        <a href="{{ '/usage.html' | relative_url }}">usage</a>
        <a href="{{ '/hierarchy.html' | relative_url }}">hierarchy</a>
        <a href="{{ site.github_repo }}">github</a>
      </nav>
    </header>

    <main>
      {{ content }}
    </main>

    <footer class="site">
      <span>phomv · photo move</span>
      <a href="{{ site.github_repo }}">github.com/chinny-labs/phomv</a>
      <a href="{{ site.github_repo }}/blob/main/LICENSE">MIT license</a>
    </footer>
  </div>
</body>
</html>
